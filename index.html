<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 1rem; background: #1e293b; border-bottom: 1px solid #334155; text-align: center; }
    header h1 { font-size: 1.25rem; font-weight: 600; color: #38bdf8; }
    #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .message { max-width: 80%; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.95rem; line-height: 1.4; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .agent { align-self: flex-start; background: #334155; color: #f8fafc; }
    #input-form { padding: 1rem; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 0.5rem; }
    #message-input { flex: 1; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; }
    #message-input:focus { border-color: #38bdf8; }
    button { padding: 0.75rem 1.25rem; border: none; border-radius: 0.5rem; background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; }
    button:hover { background: #0284c7; color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Hermes Agent</h1>
  </header>
  <div id="chat-container">
    <div class="message agent">Hello! I am your Hermes Agent. How can I help you today?</div>
  </div>
  <form id="input-form">
    <input type="text" id="message-input" placeholder="Type a message..." required />
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById('input-form');
    const input = document.getElementById('message-input');
    const container = document.getElementById('chat-container');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = text;
      container.appendChild(userMsg);

      input.value = '';
      container.scrollTop = container.scrollHeight;

      setTimeout(() => {
        const agentMsg = document.createElement('div');
        agentMsg.className = 'message agent';
        agentMsg.textContent = 'Hermes Agent received your message.';
        container.appendChild(agentMsg);
        container.scrollTop = container.scrollHeight;
      }, 600);
    });
  </script>
</body>
</html>
